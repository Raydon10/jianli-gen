<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>简历 Gen</title>
    <link rel="stylesheet" href="/app/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <div class="toast" id="toast" aria-live="polite" aria-atomic="true"></div>
      <section class="panel left-rail">
        <div class="panel-header">
          <h2>简历 Gen - 保护隐私的 Skill</h2>
          <div class="header-actions">
            <span class="save-hint" id="saveHint" hidden>保存后再让 Skill 生成简历</span>
            <button class="text-button" id="saveAll">保存</button>
          </div>
        </div>
        <div class="left-columns">
          <section class="panel public-panel">
            <div class="panel-header">
              <div class="title-with-status">
                <h2>Skill 读取的脱敏简历</h2>
                <div class="status-inline" id="aiStatusBar"></div>
              </div>
              <div class="header-actions">
                <button class="text-button" id="regeneratePublic">清空</button>
              </div>
            </div>
            <div
              class="masked-preview ai-editor"
              id="maskedPreview"
              role="textbox"
              aria-multiline="true"
              data-placeholder="请输入或粘贴 Skill 要参考的简历，并在隐私信息模块进行脱敏"
            ></div>
            <section class="tutorial-drawer is-open" id="tutorialDrawer">
              <button class="tutorial-drawer-toggle" id="tutorialDrawerToggle" type="button" aria-expanded="true">
                <span>使用教程</span>
                <span id="tutorialDrawerToggleText">收起</span>
              </button>
              <div class="tutorial-drawer-body" id="tutorialDrawerBody"></div>
            </section>
          </section>

          <section class="panel privacy-panel">
            <div class="panel-header">
              <div class="title-with-status">
                <h2>隐私信息</h2>
                <div class="status-inline" id="privateStatusBar"></div>
                <div class="private-unlock-group">
                  <button class="text-button" id="unlockPrivate">解锁</button>
                  <div class="private-unlock-popover" id="privateUnlockPopover" hidden>
                    <div class="private-unlock-note" id="privateUnlockNote"></div>
                    <input class="key-input" id="privateKey" type="password" autocomplete="off" placeholder="隐私密钥">
                    <button class="text-button" id="unlockPrivateConfirm">解锁</button>
                    <label class="private-unlock-remember">
                      <input id="rememberUnlock" type="checkbox">
                      <span>记住密钥</span>
                    </label>
                    <div class="private-unlock-hint" id="privateUnlockHint"></div>
                  </div>
                </div>
              </div>
              <div class="header-actions">
                <button class="icon-button" id="addField" title="添加字段" aria-label="添加字段">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                  </svg>
                </button>
                <button class="icon-button" id="addImage" title="添加图片" aria-label="添加图片">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5z" fill="none" stroke="currentColor" stroke-width="1.8" />
                    <path d="M7.2 15.2 10 12.4l2.2 2.2 2.2-2.8 2.6 3.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    <circle cx="9" cy="8.2" r="1.2" fill="currentColor" />
                  </svg>
                </button>
              </div>
            </div>
            <div class="field-list" id="fieldList"></div>
          </section>
        </div>
      </section>

      <section class="panel workspace-panel">
        <div class="panel-header">
          <h2>简历预览</h2>
          <div class="header-actions">
            <button class="text-button latest-resume-button" id="viewLatestResume" hidden>查看最新</button>
            <button class="text-button" id="printResume">导出 PDF</button>
            <span class="export-info" tabindex="0" aria-label="导出提示">
              <span aria-hidden="true">i</span>
              <span class="export-info-tooltip" role="tooltip">导出时如有页眉/页脚，关闭对应选项即可正常导出</span>
            </span>
          </div>
        </div>
        <article class="resume-page" id="resumePreview"></article>
        <div class="template-section">
          <div class="template-section-title">简历模版</div>
          <div class="template-strip">
            <button class="template-scroll-button" id="templateScrollLeft" type="button" aria-label="向左浏览模版">‹</button>
            <div class="template-list" id="templateList"></div>
            <button class="template-scroll-button" id="templateScrollRight" type="button" aria-label="向右浏览模版">›</button>
          </div>
        </div>
      </section>
    </main>

    <script src="/app/tiptap-editor.bundle.js"></script>
    <script type="module" src="/app/script.js"></script>
  </body>
</html>
